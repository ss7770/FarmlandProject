<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更多</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="../static/js/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="card" class="card">
            <div class="controls">
                <label>参数</label>
                <select id="select">
                    <option value="temp">温度</option>
                    <option value="humi">湿度</option>
                    <option value="light">光照强度</option>
                    <option value="soil">土壤湿度</option>
                    <option value="water">水位</option>
                </select>
                <div class="time-buttons">
                    <button id="btn-6h">近6h</button>
                    <button id="btn-24h">近24h</button>
                    <button id="btn-3d">近3天</button>
                </div>
                <button id="btn-refresh" class="btn-refresh">刷新</button>
            </div>
        </div>
        <div class="chart">
            <div id="chart" style="width: 100%; height: 400px;"></div>
        </div>
        <div class="weather">
            <h4>今日天气 & 灌溉建议</h4>
            <div id="weather-header">
                <span class="weather-icon">{{ weather.weather | weather_icon }}</span>
                <span class="weather-desc">{{ weather.weather }}</span>
                <span class="weather-temp">{{ weather.temperature }}°C</span>
            </div>
            <div id="weather-content">
                <span>空气湿度：{{ weather.humidity}}%</span>
                <span>土壤湿度：{{ weather.soilHumidity }}%</span>
                <span>24h降雨：{{weather.rain24h}}mm</span>
            </div>
            <div class="weather-advice">
                灌溉建议：{{ weather.reason }}
        </div>
        </div>
        <div class="disease-panel">
            <h4>病害巡检记录（自动）</h4>
            <ul id="disease-list" style="list-style:none;padding:0;">
                <li>加载中…</li>
            </ul>
        </div>
    </div>
    <script src="../static/js/main.js"></script>
</body>
</html>
