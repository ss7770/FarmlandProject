apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.example.smartfarm"
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    // 2026-10-05：底部 Tab 栏需要 Material 组件（BottomNavigationView / MaterialCardView /
    // SwitchMaterial）。版本必须钉 1.4.0 —— 1.5.0+ 的 AAR 要求 compileSdk>=31，
    // 本工程 compileSdk=30 + AGP 4.2.2，升上去会在 AAR 元数据校验阶段直接失败。
    implementation 'com.google.android.material:material:1.4.0'
    // 2026-10-01：移除 org.tensorflow:tensorflow-lite。
    // 本地 TFLite 推理（DiseaseDetector）随原生病害识别页一起删除——识别统一走后端 / K230，
    // APP 只负责显示与通知，不再需要自带模型（APK 因此少了约 13MB）。
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}